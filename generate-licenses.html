<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔑 إنشاء أكواد التفعيل</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: #0f172a;
    color:#e2e8f0;
    font-family:'Segoe UI', system-ui, sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
  }
  .card {
    width:100%; max-width:560px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:20px;
    padding:36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 { font-size:24px; text-align:center; margin-bottom:6px; color:#fff; }
  .sub { text-align:center; color:#64748b; font-size:14px; margin-bottom:28px; }

  label { display:block; font-size:13px; color:#94a3b8; margin-bottom:6px; font-weight:600; }
  select, input[type="number"] {
    width:100%;
    padding:12px 16px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:10px;
    color:#e2e8f0;
    font-size:15px;
    margin-bottom:20px;
    outline:none;
    transition: border-color .2s;
  }
  select:focus, input[type="number"]:focus { border-color:#8b5cf6; }
  select option { background:#1e293b; }

  .row { display:flex; gap:16px; }
  .row > div { flex:1; }

  .btn-gen {
    width:100%;
    padding:14px;
    background: linear-gradient(135deg,#8b5cf6,#6d28d9);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition: opacity .2s, transform .15s;
  }
  .btn-gen:hover { opacity:.85; transform:translateY(-1px); }
  .btn-gen:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  #status {
    margin-top:20px;
    padding:12px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    display:none;
  }
  .status-ok  { background:#1e3a2f; color:#4ade80; border:1px solid #166534; display:block!important; }
  .status-err { background:#3b1f1f; color:#f87171; border:1px solid #991b1b; display:block!important; }
  .status-loading { background:#1e293b; color:#94a3b8; border:1px solid #334155; display:block!important; }

  #codesBox {
    display:none;
    margin-top:24px;
  }
  .codes-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .codes-header span { font-size:13px; color:#94a3b8; font-weight:600; }
  .btn-copy {
    padding:6px 14px;
    background:#334155;
    color:#e2e8f0;
    border:none;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition: background .2s;
  }
  .btn-copy:hover { background:#475569; }
  .btn-copy.copied { background:#166534; color:#4ade80; }

  #codesList {
    background:#0f172a;
    border:1px solid #334155;
    border-radius:10px;
    padding:16px;
    max-height:260px;
    overflow-y:auto;
    font-family:'Courier New', monospace;
    font-size:14px;
    line-height:2;
    color:#22d3ee;
  }
  .code-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 0;
    border-bottom:1px solid #1e293b;
  }
  .code-row:last-child { border-bottom:none; }
  .code-row .code { letter-spacing:1px; }
  .code-row .badge {
    font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px;
    font-family:'Segoe UI',sans-serif; letter-spacing:0;
  }
  .badge-pro      { background:#4c1d95; color:#a78bfa; }
  .badge-gold     { background:#78350f; color:#fcd34d; }
  .badge-ultimate { background:#1e1b4b; color:#818cf8; }
  .badge-vip      { background:#831843; color:#f472b6; }
  .badge-max      { background:#14532d; color:#4ade80; }

  /* scrollbar */
  #codesList::-webkit-scrollbar { width:6px; }
  #codesList::-webkit-scrollbar-track { background:#0f172a; }
  #codesList::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
</style>
</head>
<body>

<div class="card">
  <h1>🔑 إنشاء أكواد التفعيل</h1>
  <p class="sub">تُضاف الأكواد مباشرة في Firestore</p>

  <div class="row">
    <div>
      <label>نوع الكود</label>
      <select id="typeSelect">
        <option value="PRO">PRO — الأساسية</option>
        <option value="GOLD">GOLD — الذهبية</option>
        <option value="ULTIMATE">ULTIMATE — العليا</option>
        <option value="VIP">VIP</option>
        <option value="MAX">MAX — القصوى</option>
      </select>
    </div>
    <div>
      <label>العدد</label>
      <input type="number" id="countInput" value="10" min="1" max="100"/>
    </div>
  </div>

  <button class="btn-gen" id="genBtn" onclick="generate()">⚡ إنشاء الأكواد</button>

  <div id="status"></div>

  <div id="codesBox">
    <div class="codes-header">
      <span id="codesTitle">الأكواد المنشأة</span>
      <button class="btn-copy" id="copyBtn" onclick="copyAll()">📋 نسخ كل الأكواد</button>
    </div>
    <div id="codesList"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

// ─── Firebase config ───
const firebaseConfig = {
  apiKey: "AIzaSyBoDXsELYXl440Wb3bd6xir0sMbj-6LSIA",
  authDomain: "cod-pricing.firebaseapp.com",
  projectId: "cod-pricing",
  storageBucket: "cod-pricing.firebasestorage.app",
  messagingSenderId: "815665273956",
  appId: "1:815665273956:web:6a496b1d28da2aa0b25371"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ─── إنشاء كود عشوائي ───
// الصيغة: CODxxx-XXXX-XXXX-XXXX
function makeCode(type) {
  const prefix = "COD" + type.slice(0,3).toUpperCase(); // مثل CODPRO
  const chars  = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // بدون 0,1,I,O
  const rand   = (n) => Array.from({length:n}, () => chars[Math.random()*chars.length|0]).join('');
  return `${prefix}-${rand(4)}-${rand(4)}-${rand(4)}`;
}

// ─── رفع كل الأكواد للـ Firestore ───
async function pushCodes(codes, type) {
  for (const code of codes) {
    await setDoc(doc(db, "licenses", code), {
      key:       code,
      type:      type,
      status:    "active",
      createdAt: new Date()
    });
  }
}

// ─── تحديث الـ badge حسب النوع ───
function badgeClass(type) {
  return "badge badge-" + type.toLowerCase();
}

// ─── الدالة الرئيسية ───
window.generate = async function() {
  const type  = document.getElementById("typeSelect").value;
  const count = parseInt(document.getElementById("countInput").value) || 0;
  const btn   = document.getElementById("genBtn");
  const status= document.getElementById("status");
  const box   = document.getElementById("codesBox");
  const list  = document.getElementById("codesList");

  // validation
  if (count < 1 || count > 100) {
    status.className = "status-err";
    status.textContent = "⚠️ العدد يجب أن يكون بين 1 و 100";
    return;
  }

  // حالة جاري
  btn.disabled = true;
  btn.textContent = "⏳ جاري الإنشاء...";
  status.className = "status-loading";
  status.textContent = `🔄 جاري إنشاء ${count} كود من نوع ${type}...`;
  box.style.display = "none";

  try {
    // إنشاء الأكواد محلياً
    const codes = [];
    const seen  = new Set();
    while (codes.length < count) {
      const c = makeCode(type);
      if (!seen.has(c)) { seen.add(c); codes.push(c); }
    }

    // رفع للـ Firestore
    await pushCodes(codes, type);

    // عرض النتيجة
    status.className  = "status-ok";
    status.textContent = `✅ تم إنشاء ${count} كود بنجاح وتم حفظهم في Firestore!`;

    list.innerHTML = codes.map(c =>
      `<div class="code-row">
         <span class="code">${c}</span>
         <span class="${badgeClass(type)}">${type}</span>
       </div>`
    ).join("");

    document.getElementById("codesTitle").textContent = `الأكواد المنشأة (${count})`;
    box.style.display = "block";

    // حفظ الأكواد كـ نص لأنه نحتاجها للنسخ
    window._lastCodes = codes;

  } catch (err) {
    status.className  = "status-err";
    status.textContent = "❌ حدث خطأ: " + (err.message || err);
    console.error(err);
  }

  btn.disabled    = false;
  btn.textContent = "⚡ إنشاء الأكواد";
};

// ─── نسخ كل الأكواد ───
window.copyAll = function() {
  if (!window._lastCodes) return;
  navigator.clipboard.writeText(window._lastCodes.join("\n")).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "✅ تم النسخ!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋 نسخ كل الأكواد"; btn.classList.remove("copied"); }, 2000);
  });
};
</script>
</body>
</html>
