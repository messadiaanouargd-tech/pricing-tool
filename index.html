                  ).join('')}
                </select>
              </div>
            </div>
          </div>

          <div style="margin-bottom:18px;">
            <label style="display:block;margin-bottom:8px;font-weight:700;">🎯 المنصة الإعلانية</label>
            <select id="campaignPlatform" class="premium-select" style="width:100%;padding:12px;border-radius:12px;">
              <option value="facebook" ${campaign.platform === 'facebook' ? 'selected' : ''}>Facebook Ads</option>
              <option value="google" ${campaign.platform === 'google' ? 'selected' : ''}>Google Ads</option>
              <option value="instagram" ${campaign.platform === 'instagram' ? 'selected' : ''}>Instagram Ads</option>
              <option value="tiktok" ${campaign.platform === 'tiktok' ? 'selected' : ''}>TikTok Ads</option>
              <option value="snapchat" ${campaign.platform === 'snapchat' ? 'selected' : ''}>Snapchat Ads</option>
              <option value="other" ${campaign.platform === 'other' ? 'selected' : ''}>أخرى</option>
            </select>
          </div>

          <div style="display:flex;gap:12px;margin-top:24px;">
            <button onclick="this.closest('.modal-overlay').remove()" class="btn" style="flex:1;padding:12px;border-radius:12px;font-weight:700;">إلغاء</button>
            <button onclick="saveCampaign('${campaignId}')" class="btn-gradient" style="flex:1;padding:12px;font-weight:700;">حفظ التعديلات</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
    }

    // Delete campaign
    function deleteCampaign(campaignId) {
      if (!confirm('هل أنت متأكد من حذف هذه الحملة؟')) return;

      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      product.campaigns = product.campaigns.filter(c => c.id !== campaignId);
      saveProducts();
      
      showAlert('✅ تم حذف الحملة بنجاح!', 'success');
      renderCampaignsList();
    }

    // Show comparison mode
    function showComparisonMode() {
      const product = products.find(p => p.id === currentProductId);
      if (!product || !product.days || product.days.length < 2) {
        showAlert('⚠️ يجب أن يكون لديك يومين على الأقل للمقارنة', 'error');
        return;
      }

      const container = document.getElementById('comparisonMode');
      if (!container) return;

      const isVisible = container.style.display !== 'none';
      
      if (isVisible) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';
      container.innerHTML = `
        <div class="comparison-container">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h4 style="font-weight:800;font-size:20px;margin:0;">🔄 مقارنة يومين</h4>
            <button onclick="document.getElementById('comparisonMode').style.display='none'" class="btn" style="padding:8px 14px;border-radius:10px;font-size:13px;">إغلاق</button>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
            <div>
              <label style="display:block;margin-bottom:8px;font-weight:700;">اليوم الأول</label>
              <select id="compareDay1" class="premium-select" style="width:100%;padding:10px;border-radius:10px;" onchange="updateComparison()">
                ${product.days.sort((a, b) => new Date(b.date) - new Date(a.date)).map((d, i) => 
                  `<option value="${d.date}" ${i === 0 ? 'selected' : ''}>${d.date}</option>`
                ).join('')}
              </select>
            </div>
            <div>
              <label style="display:block;margin-bottom:8px;font-weight:700;">اليوم الثاني</label>
              <select id="compareDay2" class="premium-select" style="width:100%;padding:10px;border-radius:10px;" onchange="updateComparison()">
                ${product.days.sort((a, b) => new Date(b.date) - new Date(a.date)).map((d, i) => 
                  `<option value="${d.date}" ${i === 1 ? 'selected' : ''}>${d.date}</option>`
                ).join('')}
              </select>
            </div>
          </div>

          <div id="comparisonResults"></div>
        </div>
      `;

      updateComparison();
    }

    // Update comparison
    function updateComparison() {
      const day1Date = document.getElementById('compareDay1').value;
      const day2Date = document.getElementById('compareDay2').value;

      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      const day1 = product.days.find(d => d.date === day1Date);
      const day2 = product.days.find(d => d.date === day2Date);

      if (!day1 || !day2) return;

      const profit1 = calculateDayProfit(day1);
      const profit2 = calculateDayProfit(day2);
      const profitDiff = profit2 - profit1;
      const profitDiffPercent = profit1 !== 0 ? ((profitDiff / Math.abs(profit1)) * 100) : 0;

      const roi1 = calculateDayROI(day1);
      const roi2 = calculateDayROI(day2);
      const roiDiff = roi2 - roi1;

      const orders1 = day1.expectedOrders * (day1.confirmRate / 100) * (day1.deliveryRate / 100);
      const orders2 = day2.expectedOrders * (day2.confirmRate / 100) * (day2.deliveryRate / 100);
      const ordersDiff = orders2 - orders1;
      const ordersDiffPercent = orders1 !== 0 ? ((ordersDiff / orders1) * 100) : 0;

      const container = document.getElementById('comparisonResults');
      if (!container) return;

      container.innerHTML = `
        <div class="comparison-grid">
          <div class="comparison-card">
            <div class="comparison-label">💰 الربح - ${day1Date}</div>
            <div class="comparison-value">${formatNumber(profit1)} دج</div>
            <div class="comparison-diff ${profitDiff >= 0 ? 'positive' : 'negative'}">
              ${profitDiff >= 0 ? '↗' : '↘'} ${Math.abs(profitDiffPercent).toFixed(1)}%
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">💰 الربح - ${day2Date}</div>
            <div class="comparison-value">${formatNumber(profit2)} دج</div>
            <div class="comparison-diff ${profitDiff >= 0 ? 'positive' : 'negative'}">
              ${formatNumber(profitDiff)} دج
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">📊 ROI - ${day1Date}</div>
            <div class="comparison-value">${formatNumber(roi1)}%</div>
            <div class="comparison-diff ${roiDiff >= 0 ? 'positive' : 'negative'}">
              ${roiDiff >= 0 ? '↗' : '↘'} ${Math.abs(roiDiff).toFixed(1)}%
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">📊 ROI - ${day2Date}</div>
            <div class="comparison-value">${formatNumber(roi2)}%</div>
            <div class="comparison-diff ${roiDiff >= 0 ? 'positive' : 'negative'}">
              ${roiDiff >= 0 ? 'تحسّن' : 'انخفض'} بـ ${Math.abs(roiDiff).toFixed(1)} نقطة
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">📦 الطلبات المسلّمة - ${day1Date}</div>
            <div class="comparison-value">${formatNumber(orders1)}</div>
            <div class="comparison-diff ${ordersDiff >= 0 ? 'positive' : 'negative'}">
              ${ordersDiff >= 0 ? '↗' : '↘'} ${Math.abs(ordersDiffPercent).toFixed(1)}%
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">📦 الطلبات المسلّمة - ${day2Date}</div>
            <div class="comparison-value">${formatNumber(orders2)}</div>
            <div class="comparison-diff ${ordersDiff >= 0 ? 'positive' : 'negative'}">
              ${formatNumber(ordersDiff)} طلب
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">💸 الإنفاق الإعلاني - ${day1Date}</div>
            <div class="comparison-value">${formatNumber(day1.adSpend)} دج</div>
            <div class="comparison-diff ${day2.adSpend - day1.adSpend >= 0 ? 'negative' : 'positive'}">
              ${day2.adSpend - day1.adSpend >= 0 ? '↗' : '↘'} ${formatNumber(Math.abs(day2.adSpend - day1.adSpend))} دج
            </div>
          </div>

          <div class="comparison-card">
            <div class="comparison-label">💸 الإنفاق الإعلاني - ${day2Date}</div>
            <div class="comparison-value">${formatNumber(day2.adSpend)} دج</div>
            <div class="comparison-diff ${day2.adSpend > day1.adSpend ? 'negative' : 'positive'}">
              ${day2.adSpend > day1.adSpend ? 'زيادة' : 'توفير'}
            </div>
          </div>
        </div>

        <div class="alert-info" style="margin-top:20px;">
          <strong>📊 الخلاصة:</strong> 
          ${profitDiff >= 0 ? 
            `اليوم الثاني (${day2Date}) كان أفضل بفارق ${formatNumber(profitDiff)} دج ربح.` : 
            `اليوم الأول (${day1Date}) كان أفضل بفارق ${formatNumber(Math.abs(profitDiff))} دج ربح.`
          }
        </div>
      `;
    }

    // Export charts
    function exportCharts() {
      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      // Prepare report data
      const reportDate = new Date().toLocaleDateString('ar-DZ');
      const totalDays = product.days ? product.days.length : 0;
      const totalProfit = calculateProductTotalProfit(product);
      const avgDailyProfit = totalDays > 0 ? totalProfit / totalDays : 0;

      let report = `
═══════════════════════════════════════════════
       📊 تقرير المنتج - ${product.name}
═══════════════════════════════════════════════
📅 تاريخ التقرير: ${reportDate}
🕐 الوقت: ${new Date().toLocaleTimeString('ar-DZ')}

═══════════════════════════════════════════════
📈 الإحصائيات العامة
═══════════════════════════════════════════════
📦 عدد الأيام المسجلة: ${totalDays} يوم
💰 إجمالي الأرباح: ${formatNumber(totalProfit)} دج
📊 متوسط الربح اليومي: ${formatNumber(avgDailyProfit)} دج
💵 الربح الشهري المتوقع: ${formatNumber(avgDailyProfit * 30)} دج

═══════════════════════════════════════════════
📅 تفاصيل الأيام
═══════════════════════════════════════════════
`;

      if (product.days && product.days.length > 0) {
        product.days.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(day => {
          const profit = calculateDayProfit(day);
          const roi = calculateDayROI(day);
          const deliveredOrders = day.expectedOrders * (day.confirmRate / 100) * (day.deliveryRate / 100);

          report += `
📅 ${day.date}
   💰 الربح: ${formatNumber(profit)} دج
   📊 ROI: ${formatNumber(roi)}%
   📦 الطلبات المسلّمة: ${formatNumber(deliveredOrders)}
   💸 الإنفاق الإعلاني: ${formatNumber(day.adSpend)} دج
   ✅ نسبة التأكيد: ${day.confirmRate}%
   🚚 نسبة التسليم: ${day.deliveryRate}%
   ─────────────────────────────────────────
`;
        });
      }

      // Add campaigns if any
      if (product.campaigns && product.campaigns.length > 0) {
        report += `
═══════════════════════════════════════════════
📢 الحملات الإعلانية
═══════════════════════════════════════════════
`;

        product.campaigns.forEach(campaign => {
          const campaignDays = product.days.filter(d => 
            new Date(d.date) >= new Date(campaign.startDate) && 
            new Date(d.date) <= new Date(campaign.endDate)
          );

          const totalSpend = campaignDays.reduce((sum, d) => sum + (d.adSpend || 0), 0);
          const totalProfit = campaignDays.reduce((sum, d) => sum + calculateDayProfit(d), 0);
          const roi = totalSpend > 0 ? ((totalProfit / totalSpend) * 100) : 0;

          report += `
📢 ${campaign.name}
   🎯 المنصة: ${campaign.platform}
   📅 الفترة: ${campaign.startDate} → ${campaign.endDate}
   💸 الإنفاق: ${formatNumber(totalSpend)} دج
   💰 الربح: ${formatNumber(totalProfit)} دج
   📊 ROI: ${formatNumber(roi)}%
   ─────────────────────────────────────────
`;
        });
      }

      report += `
═══════════════════════════════════════════════
🔗 تم إنشاء التقرير بواسطة COD Pricing Pro v6.0
═══════════════════════════════════════════════
`;

      // Create and download file
      const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `تقرير_${product.name}_${new Date().toISOString().split('T')[0]}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showAlert('✅ تم تصدير التقرير بنجاح!', 'success');
    }

    // Set chart range
    function setChartRange(range) {
      document.querySelectorAll('.date-quick-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      // Filter days based on range
      const product = products.find(p => p.id === currentProductId);
      if (!product || !product.days) return;

      renderAllCharts();
    }

    // Monthly predictions
    function renderMonthlyPredictions() {
      const container = document.getElementById('monthlyPredictions');
      if (!container) return;

      const product = products.find(p => p.id === currentProductId);
      if (!product || !product.days || product.days.length === 0) {
        container.innerHTML = '<div class="alert-yellow">لا توجد بيانات كافية للتوقعات. قم بإضافة بيانات أيام أولاً.</div>';
        return;
      }

      const avgProfit = product.days.reduce((sum, d) => sum + calculateDayProfit(d), 0) / product.days.length;
      const avgROI = product.days.reduce((sum, d) => sum + calculateDayROI(d), 0) / product.days.length;
      const avgOrders = product.days.reduce((sum, d) => sum + (d.expectedOrders * (d.confirmRate / 100) * (d.deliveryRate / 100)), 0) / product.days.length;
      const avgSpend = product.days.reduce((sum, d) => sum + (d.adSpend || 0), 0) / product.days.length;

      const monthlyProfit = avgProfit * 30;
      const monthlyOrders = avgOrders * 30;
      const monthlySpend = avgSpend * 30;
      const monthlyRevenue = monthlyProfit + monthlySpend;

      // Calculate trend
      const recentDays = product.days.slice(-7);
      const olderDays = product.days.slice(0, Math.min(7, product.days.length - 7));
      
      const recentAvgProfit = recentDays.length > 0 ? 
        recentDays.reduce((sum, d) => sum + calculateDayProfit(d), 0) / recentDays.length : 0;
      const olderAvgProfit = olderDays.length > 0 ? 
        olderDays.reduce((sum, d) => sum + calculateDayProfit(d), 0) / olderDays.length : 0;
      
      const trend = olderAvgProfit !== 0 ? ((recentAvgProfit - olderAvgProfit) / Math.abs(olderAvgProfit)) * 100 : 0;

      container.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:24px;">
          <div class="stat-card">
            <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💰 الربح الشهري المتوقع</div>
            <div style="font-size:32px;font-weight:900;color:var(--good);">${formatNumber(monthlyProfit)} دج</div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;">
              ${trend >= 0 ? '↗' : '↘'} ${trend >= 0 ? 'زيادة' : 'انخفاض'} ${Math.abs(trend).toFixed(1)}%
            </div>
          </div>

          <div class="stat-card">
            <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">📊 متوسط الربح اليومي</div>
            <div style="font-size:32px;font-weight:900;color:var(--brand2);">${formatNumber(avgProfit)} دج</div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;">
              بناءً على ${product.days.length} يوم
            </div>
          </div>

          <div class="stat-card">
            <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">📦 الطلبات الشهرية المتوقعة</div>
            <div style="font-size:32px;font-weight:900;color:var(--brand3);">${formatNumber(monthlyOrders)}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;">
              ~${formatNumber(avgOrders)} طلب/يوم
            </div>
          </div>

          <div class="stat-card">
            <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💸 الإنفاق الشهري المتوقع</div>
            <div style="font-size:32px;font-weight:900;color:var(--brand1);">${formatNumber(monthlySpend)} دج</div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;">
              ~${formatNumber(avgSpend)} دج/يوم
            </div>
          </div>

          <div class="stat-card">
            <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">📈 متوسط ROI</div>
            <div style="font-size:32px;font-weight:900;color:${avgROI >= 0 ? 'var(--good)' : 'var(--bad)'};">${formatNumber(avgROI)}%</div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;">
              على مدار ${product.days.length} يوم
            </div>
          </div>

          <div class="stat-card">
            <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💵 الإيرادات الشهرية المتوقعة</div>
            <div style="font-size:32px;font-weight:900;color:white;">${formatNumber(monthlyRevenue)} دج</div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;">
              الربح + المصاريف
            </div>
          </div>
        </div>

        <div class="alert-info">
          <strong>💡 كيف نحسب التوقعات:</strong>
          <ul style="margin:10px 0 0 0;padding-right:20px;">
            <li>نحسب متوسط الربح اليومي من الأيام الـ ${product.days.length} المسجلة</li>
            <li>نضرب المتوسط × 30 يوم للحصول على التوقع الشهري</li>
            <li>الاتجاه محسوب من مقارنة آخر 7 أيام مع الأيام السابقة</li>
          </ul>
        </div>

        ${trend > 10 ? `
          <div class="alert-info" style="background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:#4ade80;margin-top:16px;">
            <strong>🎉 رائع!</strong> أداء منتجك في تحسّن مستمر! استمر على هذا النهج.
          </div>
        ` : trend < -10 ? `
          <div class="alert-yellow" style="margin-top:16px;">
            <strong>⚠️ تحذير:</strong> لاحظنا انخفاضاً في الأداء مؤخراً. راجع استراتيجيتك الإعلانية.
          </div>
        ` : ''}
      `;
    }
  </script>

  <!-- Firebase Auth Logic -->
  <script type="module">
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    
    const auth = window.firebaseAuth;
    const googleProvider = new GoogleAuthProvider();
    
    onAuthStateChanged(auth, (user) => {
      const overlay = document.getElementById('authOverlay');
      if (overlay) {
        if (user) {
          overlay.style.display = 'none';
        } else {
          overlay.style.display = 'flex';
        }
      }
    });
    
    window.emailLogin = async () => {
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
      } catch(e) {
        alert("خطأ في الدخول: " + e.code);
      }
    };
    
    window.emailSignup = async () => {
      try {
        await createUserWithEmailAndPassword(auth, document.getElementById('signupEmail').value, document.getElementById('signupPass').value);
      } catch(e) {
        alert("خطأ في التسجيل: " + e.code);
      }
    };
    
    window.googleLogin = async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch(e) {
        alert("خطأ جوجل: " + e.code);
      }
    };
    
    window.resetPassword = async () => {
      const email = document.getElementById('resetEmail').value;
      if (!email) return alert("اكتب الإيميل أولاً");
      try {
        await sendPasswordResetEmail(auth, email);
        alert("تم إرسال رابط التغيير!");
        window.showLogin();
      } catch(e) {
        alert("خطأ: " + e.code);
      }
    };
    
    window.logout = () => signOut(auth);
    window.showSignup = () => {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
    };
    window.showLogin = () => {
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    };
    window.showReset = () => {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('resetForm').style.display = 'block';
    };
  </script>

</body>
