<!-- COD Pricing Pro v6.0 - Ultimate Enhanced Edition -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRO • COD Pricing Tool v6.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg0:#070812;--bg1:#060713;--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.66);--stroke:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.10);--brand1:#8b5cf6;--brand2:#22d3ee;--brand3:#60a5fa;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--shadow:0 24px 70px rgba(0,0,0,.45);}
    html,body{height:100%}
    body{margin:0;color:var(--text);background:radial-gradient(1200px 700px at 70% 10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(1000px 600px at 10% 35%,rgba(34,211,238,.14),transparent 55%),radial-gradient(900px 700px at 50% 100%,rgba(96,165,250,.12),transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));font-family:Tajawal,Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden;font-size:16px;}
    .glass{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid var(--stroke);box-shadow:var(--shadow);backdrop-filter:blur(16px);}
    .glass-strong{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);box-shadow:0 26px 90px rgba(0,0,0,.52);backdrop-filter:blur(18px);}
    .soft-border{position:relative}
    .soft-border:before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(135deg,rgba(139,92,246,.55),rgba(34,211,238,.35),rgba(96,165,250,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none;}
    .gradient-text{background:linear-gradient(135deg,var(--brand1),var(--brand2),var(--brand3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .premium-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--text);outline:none;transition:.18s ease;font-size:16px!important;}
    .premium-input:focus{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 4px rgba(139,92,246,.18);background:rgba(255,255,255,.08);}
    .premium-select{background:rgba(12,12,28,.92);border:1px solid rgba(255,255,255,.14);color:var(--text);outline:none;transition:.18s ease;font-size:15px!important;cursor:pointer;}
    .premium-select:focus{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 4px rgba(139,92,246,.18);}
    .premium-select option{background:#0f1030;color:white;}
    .btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);transition:.2s ease;cursor:pointer;}
    .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
    .btn.active{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(34,211,238,.45));border-color:rgba(139,92,246,.65);box-shadow:0 14px 45px rgba(139,92,246,.22);}
    .btn-gradient{border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,rgba(139,92,246,.92),rgba(34,211,238,.45));border-radius:16px;font-weight:900;transition:.25s ease;cursor:pointer;color:white;}
    .btn-gradient:hover{transform:translateY(-2px);box-shadow:0 30px 90px rgba(34,211,238,.18),0 26px 80px rgba(139,92,246,.16);}
    .tab-button{border:1px solid transparent;color:rgba(255,255,255,.62);padding:10px 16px;border-radius:14px;transition:.2s ease;white-space:nowrap;cursor:pointer;background:transparent;}
    .tab-button:hover{color:rgba(255,255,255,.92);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.10);}
    .tab-button.active{color:rgba(255,255,255,.95);background:rgba(255,255,255,.10);border-color:rgba(139,92,246,.45);box-shadow:0 14px 45px rgba(139,92,246,.18);}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .stat-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;transition:.25s ease;backdrop-filter:blur(12px);}
    .stat-card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.35);background:rgba(255,255,255,.08);box-shadow:0 22px 70px rgba(0,0,0,.35);}
    .chart-frame{border-radius:18px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);box-shadow:0 26px 90px rgba(0,0,0,.50);}
    .chart-inner{padding:14px}
    .chart-container{position:relative;height:320px}
    label{font-size:15px!important;}
    .cost-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;animation:fadeIn .3s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .campaign-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;transition:.25s ease;position:relative;overflow:hidden;}
    .campaign-card:hover{border-color:rgba(139,92,246,.4);background:rgba(255,255,255,.08);}
    .campaign-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand1),var(--brand2));opacity:.6;}
    .status-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
    .status-profit{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
    .status-loss{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}
    .status-break{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);padding:16px;}
    .modal-box{background:linear-gradient(135deg,rgba(10,10,25,.98),rgba(5,5,18,.98));border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:32px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 120px rgba(0,0,0,.7);}
    .modal-box::-webkit-scrollbar{width:6px;}
    .modal-box::-webkit-scrollbar-thumb{background:rgba(139,92,246,.5);border-radius:3px;}
    .alert-red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:12px 16px;color:#fca5a5;font-size:13px;font-weight:600;}
    .alert-yellow{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:12px 16px;color:#fcd34d;font-size:13px;font-weight:600;}
    .alert-info{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);border-radius:12px;padding:12px 16px;color:#67e8f9;font-size:13px;font-weight:600;}
    .mini-chart-container{height:70px;position:relative;}
    .date-quick-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.8);padding:7px 14px;border-radius:10px;transition:.2s;cursor:pointer;font-size:13px;font-weight:600;}
    .date-quick-btn:hover{background:rgba(255,255,255,.14);}
    .date-quick-btn.active{background:linear-gradient(135deg,rgba(139,92,246,.7),rgba(34,211,238,.3));border-color:rgba(139,92,246,.5);color:white;}
    .day-row{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;transition:.2s;}
    .day-row:hover{background:rgba(255,255,255,.07);border-color:rgba(139,92,246,.25);}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-track{background:rgba(255,255,255,.04);}
    ::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:4px;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.6);}
    
    /* Premium Product Selector */
    .product-selector{position:relative;width:100%;}
    .product-selector-btn{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(34,211,238,.10));border:1px solid rgba(139,92,246,.35);color:white;padding:14px 20px;border-radius:16px;width:100%;text-align:right;cursor:pointer;transition:.25s ease;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
    .product-selector-btn:hover{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.15));border-color:rgba(139,92,246,.55);box-shadow:0 14px 45px rgba(139,92,246,.22);}
    .product-dropdown{position:absolute;top:calc(100% + 8px);right:0;left:0;background:linear-gradient(135deg,rgba(15,15,35,.98),rgba(8,8,22,.98));border:1px solid rgba(139,92,246,.35);border-radius:16px;max-height:400px;overflow-y:auto;z-index:1000;box-shadow:0 30px 90px rgba(0,0,0,.7);backdrop-filter:blur(18px);display:none;}
    .product-dropdown.active{display:block;animation:dropdownFade .2s ease;}
    @keyframes dropdownFade{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .product-option{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.2s ease;display:flex;justify-content:space-between;align-items:center;}
    .product-option:hover{background:rgba(139,92,246,.15);}
    .product-option:last-child{border-bottom:none;}
    .product-option.selected{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.15));border-color:rgba(139,92,246,.45);}
    .search-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:white;padding:10px 14px;border-radius:12px;width:100%;margin:10px;width:calc(100% - 20px);outline:none;}
    .search-input:focus{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 3px rgba(139,92,246,.15);}
    
    /* Calendar Styles */
    .calendar-container{background:linear-gradient(135deg,rgba(15,15,35,.95),rgba(8,8,22,.95));border:1px solid rgba(139,92,246,.35);border-radius:18px;padding:20px;margin-top:10px;}
    .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .calendar-nav-btn{background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);color:white;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.2s ease;font-weight:700;}
    .calendar-nav-btn:hover{background:rgba(139,92,246,.35);transform:scale(1.05);}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
    .calendar-day-header{text-align:center;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;padding:8px;}
    .calendar-day{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);padding:10px;text-align:center;border-radius:10px;cursor:pointer;transition:.2s ease;font-weight:600;}
    .calendar-day:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.4);}
    .calendar-day.selected{background:linear-gradient(135deg,rgba(139,92,246,.7),rgba(34,211,238,.4));border-color:rgba(139,92,246,.8);color:white;box-shadow:0 8px 25px rgba(139,92,246,.3);}
    .calendar-day.has-data{position:relative;}
    .calendar-day.has-data::after{content:"";position:absolute;bottom:3px;right:50%;transform:translateX(50%);width:5px;height:5px;background:var(--brand2);border-radius:50%;}
    .calendar-day.other-month{opacity:.3;pointer-events:none;}
    .calendar-day.today{border-color:var(--brand2);border-width:2px;}
    
    /* Days Timeline */
    .days-timeline{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:16px;margin-top:15px;max-height:300px;overflow-y:auto;}
    .timeline-item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:.2s ease;position:relative;padding-right:100px;}
    .timeline-item:hover{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.3);}
    .timeline-item.active{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.15));border-color:rgba(139,92,246,.5);}
    .timeline-date{font-weight:700;color:var(--brand2);font-size:15px;}
    .timeline-stats{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px;}
    .timeline-actions{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;gap:6px;}
    .timeline-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;transition:.2s ease;color:white;}
    .timeline-btn:hover{background:rgba(139,92,246,.3);border-color:rgba(139,92,246,.5);}
    
    /* Comparison Mode */
    .comparison-container{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:20px;margin-top:15px;}
    .comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    .comparison-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;}
    .comparison-label{color:var(--brand2);font-weight:700;font-size:13px;margin-bottom:10px;}
    .comparison-value{font-size:24px;font-weight:800;color:white;}
    .comparison-diff{font-size:13px;margin-top:6px;font-weight:600;}
    .comparison-diff.positive{color:var(--good);}
    .comparison-diff.negative{color:var(--bad);}
    
    /* Export Button */
    .export-btn{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(96,165,250,.15));border:1px solid rgba(34,211,238,.4);color:white;padding:10px 18px;border-radius:12px;cursor:pointer;transition:.2s ease;font-weight:700;font-size:14px;}
    .export-btn:hover{background:linear-gradient(135deg,rgba(34,211,238,.35),rgba(96,165,250,.25));transform:translateY(-2px);box-shadow:0 14px 45px rgba(34,211,238,.22);}
    
    /* Alerts Container */
    .alerts-container{position:fixed;top:20px;left:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;max-width:400px;}
    .alert-notification{background:linear-gradient(135deg,rgba(15,15,35,.98),rgba(8,8,22,.98));border:1px solid rgba(245,158,11,.5);border-radius:14px;padding:14px 18px;box-shadow:0 14px 45px rgba(0,0,0,.6);animation:slideIn .3s ease;}
    @keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
    .alert-notification.success{border-color:rgba(34,197,94,.5);}
    .alert-notification.error{border-color:rgba(239,68,68,.5);}
    .alert-close{float:left;cursor:pointer;margin-right:10px;font-weight:bold;color:rgba(255,255,255,.7);}
    .alert-close:hover{color:white;}
    
    /* Empty State */
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5);}
    .empty-icon{font-size:64px;margin-bottom:20px;opacity:.5;}
    .empty-title{font-size:22px;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:10px;}
    .empty-description{font-size:15px;color:rgba(255,255,255,.5);margin-bottom:25px;}
    
    /* Dashboard Stats Enhanced */
    .dashboard-stat-large{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.08));border:1px solid rgba(139,92,246,.25);border-radius:20px;padding:28px;text-align:center;}
    .dashboard-stat-value{font-size:48px;font-weight:900;background:linear-gradient(135deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .dashboard-stat-label{font-size:14px;color:rgba(255,255,255,.7);margin-top:8px;font-weight:600;}
    
    /* Top/Bottom Products */
    .product-rank-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
    .product-rank-card.top{border-right:3px solid var(--good);}
    .product-rank-card.bottom{border-right:3px solid var(--bad);}
    .rank-number{font-size:24px;font-weight:900;color:rgba(255,255,255,.3);margin-left:12px;}
    .rank-details{flex:1;margin:0 12px;}
    .rank-name{font-weight:700;color:white;font-size:15px;}
    .rank-metric{font-size:13px;color:rgba(255,255,255,.6);margin-top:2px;}
    .rank-value{font-size:18px;font-weight:800;}
    .rank-value.good{color:var(--good);}
    .rank-value.bad{color:var(--bad);}
    
    @media(max-width:768px){
      .modal-box{padding:20px;max-width:100%;}
      .cost-item{flex-direction:column;}
      .comparison-grid{grid-template-columns:1fr;}
      .product-selector-btn{font-size:14px;padding:12px 16px;}
    }
  </style>

<body>

  <!-- Alerts Container -->
  <div id="alertsContainer" class="alerts-container"></div>

  <!-- Auth Overlay -->
  <div id="authOverlay" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,rgba(8,8,22,.97),rgba(4,4,15,.97));backdrop-filter:blur(12px);z-index:100000;display:flex;align-items:center;justify-content:center;">
    <div style="background:linear-gradient(135deg,rgba(15,15,35,.98),rgba(8,8,22,.98));border:1px solid rgba(139,92,246,.35);border-radius:24px;padding:40px;max-width:420px;width:90%;box-shadow:0 40px 120px rgba(0,0,0,.8);">
      <h2 class="gradient-text" style="font-size:32px;font-weight:900;text-align:center;margin-bottom:30px;">🚀 COD Pricing Pro</h2>
      
      <!-- Login Form -->
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="premium-input" style="width:100%;padding:14px;border-radius:12px;margin-bottom:12px;" />
        <input type="password" id="loginPass" placeholder="كلمة المرور" class="premium-input" style="width:100%;padding:14px;border-radius:12px;margin-bottom:18px;" />
        <button onclick="emailLogin()" class="btn-gradient" style="width:100%;padding:14px;font-size:16px;margin-bottom:12px;">دخول</button>
        <button onclick="googleLogin()" style="width:100%;padding:14px;border-radius:12px;background:white;color:#333;font-weight:700;border:none;cursor:pointer;margin-bottom:12px;">دخول بواسطة Google</button>
        <div style="text-align:center;margin-top:16px;font-size:14px;">
          <span style="color:rgba(255,255,255,.6);">ليس لديك حساب؟</span>
          <button onclick="showSignup()" style="color:var(--brand2);background:none;border:none;cursor:pointer;font-weight:700;text-decoration:underline;">إنشاء حساب</button>
        </div>
        <div style="text-align:center;margin-top:8px;">
          <button onclick="showReset()" style="color:rgba(255,255,255,.6);background:none;border:none;cursor:pointer;font-size:13px;text-decoration:underline;">نسيت كلمة المرور؟</button>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" style="display:none;">
        <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" class="premium-input" style="width:100%;padding:14px;border-radius:12px;margin-bottom:12px;" />
        <input type="password" id="signupPass" placeholder="كلمة المرور" class="premium-input" style="width:100%;padding:14px;border-radius:12px;margin-bottom:18px;" />
        <button onclick="emailSignup()" class="btn-gradient" style="width:100%;padding:14px;font-size:16px;margin-bottom:12px;">إنشاء حساب</button>
        <button onclick="googleLogin()" style="width:100%;padding:14px;border-radius:12px;background:white;color:#333;font-weight:700;border:none;cursor:pointer;margin-bottom:12px;">التسجيل بواسطة Google</button>
        <div style="text-align:center;margin-top:16px;">
          <button onclick="showLogin()" style="color:var(--brand2);background:none;border:none;cursor:pointer;font-weight:700;text-decoration:underline;">العودة للدخول</button>
        </div>
      </div>

      <!-- Reset Password Form -->
      <div id="resetForm" style="display:none;">
        <p style="text-align:center;color:rgba(255,255,255,.7);margin-bottom:20px;font-size:14px;">أدخل بريدك الإلكتروني لإعادة تعيين كلمة المرور</p>
        <input type="email" id="resetEmail" placeholder="البريد الإلكتروني" class="premium-input" style="width:100%;padding:14px;border-radius:12px;margin-bottom:18px;" />
        <button onclick="resetPassword()" class="btn-gradient" style="width:100%;padding:14px;font-size:16px;margin-bottom:12px;">إرسال رابط التغيير</button>
        <div style="text-align:center;margin-top:16px;">
          <button onclick="showLogin()" style="color:var(--brand2);background:none;border:none;cursor:pointer;font-weight:700;text-decoration:underline;">العودة للدخول</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div style="min-height:100vh;padding:20px;">
    <div style="max-width:1400px;margin:0 auto;">
      
      <!-- Header -->
      <div class="glass-strong soft-border" style="padding:24px 32px;border-radius:20px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div>
          <h1 class="gradient-text" style="font-size:36px;font-weight:900;margin:0;line-height:1;">COD Pricing Pro</h1>
          <p style="margin:6px 0 0 0;color:var(--muted);font-size:14px;font-weight:600;">الإصدار 6.0 • نظام متقدم لإدارة وتحليل المنتجات</p>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <button onclick="logout()" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);color:#f87171;padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:700;transition:.2s ease;">
            تسجيل خروج
          </button>
        </div>
      </div>

      <!-- Product Selector -->
      <div class="glass-strong soft-border" style="padding:24px;border-radius:20px;margin-bottom:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <h2 style="font-size:22px;font-weight:800;margin:0;">اختيار المنتج</h2>
          <div style="display:flex;gap:10px;">
            <button onclick="showAddProductModal()" class="btn-gradient" style="padding:10px 20px;font-size:14px;">
              ➕ إضافة منتج جديد
            </button>
            <button onclick="toggleDashboardView()" id="dashboardViewBtn" class="export-btn" style="padding:10px 20px;font-size:14px;">
              📊 عرض Dashboard
            </button>
          </div>
        </div>

        <!-- Product Dropdown Selector -->
        <div class="product-selector">
          <button class="product-selector-btn" onclick="toggleProductDropdown()">
            <span id="selectedProductName">اختر منتجاً...</span>
            <span style="transition:.3s;display:inline-block;" id="dropdownArrow">▼</span>
          </button>
          <div class="product-dropdown" id="productDropdown">
            <input type="text" class="search-input" placeholder="🔍 ابحث عن منتج..." id="productSearch" oninput="filterProducts()" />
            <div id="productOptions"></div>
          </div>
        </div>

        <!-- Filter & Sort Options -->
        <div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="date-quick-btn active" onclick="sortProducts('recent')">الأحدث</button>
          <button class="date-quick-btn" onclick="sortProducts('profit')">الأكثر ربحاً</button>
          <button class="date-quick-btn" onclick="sortProducts('name')">حسب الاسم</button>
        </div>
      </div>

      <!-- Dashboard View (Hidden by default) -->
      <div id="dashboardView" style="display:none;">
        <!-- Will be populated dynamically -->
      </div>

      <!-- Product Content Area (Hidden until product selected) -->
      <div id="productContentArea" style="display:none;">
        <!-- Product tabs and content will be here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="glass-strong soft-border" style="padding:60px 24px;border-radius:20px;text-align:center;">
        <div class="empty-icon">📦</div>
        <div class="empty-title">لا توجد منتجات بعد</div>
        <div class="empty-description">ابدأ بإضافة منتجك الأول لبدء التحليل والتتبع</div>
        <button onclick="showAddProductModal()" class="btn-gradient" style="padding:14px 32px;font-size:16px;margin-top:20px;">
          ➕ إضافة منتج جديد
        </button>
      </div>

    </div>
  </div>

  <!-- Modal: Add Product -->
  <div id="addProductModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeAddProductModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <h3 class="gradient-text" style="font-size:26px;font-weight:900;margin:0;">📦 إضافة منتج جديد</h3>
        <button onclick="closeAddProductModal()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;">✕</button>
      </div>
      
      <div style="margin-bottom:18px;">
        <label style="display:block;margin-bottom:8px;font-weight:700;">اسم المنتج</label>
        <input type="text" id="newProductName" class="premium-input" placeholder="مثال: حقيبة جلدية فاخرة" style="width:100%;padding:12px;border-radius:12px;" />
      </div>

      <div style="display:flex;gap:12px;margin-top:24px;">
        <button onclick="closeAddProductModal()" class="btn" style="flex:1;padding:12px;border-radius:12px;font-weight:700;">إلغاء</button>
        <button onclick="addNewProduct()" class="btn-gradient" style="flex:1;padding:12px;font-weight:700;">إضافة المنتج</button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript -->
  <script>
    // Global State
    let products = [];
    let currentProductId = null;
    let currentView = 'product'; // 'product' or 'dashboard'
    let sortMode = 'recent';
    let currentDayDate = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      renderUI();
    });

    // Load products from localStorage
    function loadProducts() {
      const saved = localStorage.getItem('cod_products_v6');
      if (saved) {
        products = JSON.parse(saved);
      }
    }

    // Save products to localStorage
    function saveProducts() {
      localStorage.setItem('cod_products_v6', JSON.stringify(products));
    }

    // Render UI
    function renderUI() {
      if (products.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('productContentArea').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'none';
        return;
      }

      document.getElementById('emptyState').style.display = 'none';
      renderProductOptions();

      if (currentView === 'dashboard') {
        showDashboard();
      } else if (currentProductId) {
        selectProduct(currentProductId);
      }
    }

    // Toggle product dropdown
    function toggleProductDropdown() {
      const dropdown = document.getElementById('productDropdown');
      const arrow = document.getElementById('dropdownArrow');
      const isActive = dropdown.classList.contains('active');
      
      if (isActive) {
        dropdown.classList.remove('active');
        arrow.style.transform = 'rotate(0deg)';
      } else {
        dropdown.classList.add('active');
        arrow.style.transform = 'rotate(180deg)';
      }
    }

    // Render product options in dropdown
    function renderProductOptions() {
      const container = document.getElementById('productOptions');
      container.innerHTML = '';

      let sortedProducts = [...products];
      
      if (sortMode === 'recent') {
        sortedProducts.sort((a, b) => b.createdAt - a.createdAt);
      } else if (sortMode === 'profit') {
        sortedProducts.sort((a, b) => {
          const profitA = calculateProductTotalProfit(a);
          const profitB = calculateProductTotalProfit(b);
          return profitB - profitA;
        });
      } else if (sortMode === 'name') {
        sortedProducts.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
      }

      sortedProducts.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-option' + (product.id === currentProductId ? ' selected' : '');
        div.onclick = () => selectProductFromDropdown(product.id);
        
        const daysCount = product.days ? product.days.length : 0;
        const profit = calculateProductTotalProfit(product);
        
        div.innerHTML = `
          <div>
            <div style="font-weight:700;font-size:15px;">${product.name}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;">${daysCount} يوم مسجل</div>
          </div>
          <div style="text-align:left;">
            <div style="font-weight:800;color:${profit >= 0 ? 'var(--good)' : 'var(--bad)'};">${formatNumber(profit)} دج</div>
            <div style="font-size:11px;color:rgba(255,255,255,.5);">الربح الإجمالي</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Filter products
    function filterProducts() {
      const searchTerm = document.getElementById('productSearch').value.toLowerCase();
      const options = document.querySelectorAll('.product-option');
      
      options.forEach(option => {
        const text = option.textContent.toLowerCase();
        option.style.display = text.includes(searchTerm) ? 'flex' : 'none';
      });
    }

    // Sort products
    function sortProducts(mode) {
      sortMode = mode;
      
      // Update active button
      document.querySelectorAll('.date-quick-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      renderProductOptions();
    }

    // Select product from dropdown
    function selectProductFromDropdown(productId) {
      currentProductId = productId;
      currentView = 'product';
      toggleProductDropdown();
      selectProduct(productId);
    }

    // Select product and show its content
    function selectProduct(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      document.getElementById('selectedProductName').textContent = product.name;
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('productContentArea').style.display = 'block';
      
      renderProductContent(product);
    }

    // Render product content
    function renderProductContent(product) {
      const container = document.getElementById('productContentArea');
      
      container.innerHTML = `
        <!-- Product Tabs -->
        <div class="glass-strong soft-border" style="padding:20px 24px;border-radius:20px;margin-bottom:24px;">
          <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;">
            <button class="tab-button active" onclick="switchProductTab('pricing')" id="tab-pricing">حاسبة التسعير</button>
            <button class="tab-button" onclick="switchProductTab('predictions')" id="tab-predictions">التوقعات الشهرية</button>
            <button class="tab-button" onclick="switchProductTab('discounts')" id="tab-discounts">حاسبة الخصومات</button>
            <button class="tab-button" onclick="switchProductTab('charts')" id="tab-charts">الرسوم البيانية</button>
            <button class="tab-button" onclick="switchProductTab('campaigns')" id="tab-campaigns">متابعة الحملات</button>
            <button class="tab-button" onclick="switchProductTab('timeline')" id="tab-timeline">السجل الزمني</button>
          </div>
        </div>

        <!-- Tab Content: Pricing -->
        <div id="content-pricing" class="tab-content active">
          ${renderPricingTab(product)}
        </div>

        <!-- Tab Content: Predictions -->
        <div id="content-predictions" class="tab-content">
          ${renderPredictionsTab(product)}
        </div>

        <!-- Tab Content: Discounts -->
        <div id="content-discounts" class="tab-content">
          ${renderDiscountsTab(product)}
        </div>

        <!-- Tab Content: Charts -->
        <div id="content-charts" class="tab-content">
          ${renderChartsTab(product)}
        </div>

        <!-- Tab Content: Campaigns -->
        <div id="content-campaigns" class="tab-content">
          ${renderCampaignsTab(product)}
        </div>

        <!-- Tab Content: Timeline -->
        <div id="content-timeline" class="tab-content">
          ${renderTimelineTab(product)}
        </div>
      `;

      // Initialize first tab calculations
      setTimeout(() => {
        if (product.days && product.days.length > 0) {
          loadDayData(product.id, product.days[product.days.length - 1].date);
        }
      }, 100);
    }

    // Switch product tabs
    function switchProductTab(tabName) {
      // Update buttons
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      
      // Update content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`content-${tabName}`).classList.add('active');

      // Re-render charts if needed
      if (tabName === 'charts') {
        setTimeout(() => renderAllCharts(), 100);
      }
    }

    // Render Pricing Tab
    function renderPricingTab(product) {
      return `
        <div class="glass-strong soft-border" style="padding:28px;border-radius:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <h3 style="font-size:24px;font-weight:800;margin:0;">📊 حاسبة التسعير والتكاليف</h3>
            <div style="display:flex;gap:10px;">
              <button onclick="copyPreviousDay()" class="export-btn" style="padding:8px 16px;font-size:13px;">📋 نسخ يوم سابق</button>
              <button onclick="saveDayData()" class="btn-gradient" style="padding:8px 16px;font-size:13px;">💾 حفظ البيانات</button>
            </div>
          </div>

          <!-- Date Selection -->
          <div style="margin-bottom:24px;">
            <label style="display:block;margin-bottom:10px;font-weight:700;font-size:16px;">📅 اختر التاريخ</label>
            <div id="calendarContainer"></div>
          </div>

          <div class="alert-info" style="margin-bottom:20px;">
            <strong>💡 نصيحة:</strong> اختر التاريخ أولاً، ثم أدخل بيانات ذلك اليوم. يمكنك إضافة بيانات أيام متعددة لنفس المنتج.
          </div>

          <!-- Pricing Inputs -->
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:24px;">
            <div>
              <label>💰 السعر النهائي للمنتج (دج)</label>
              <input type="number" id="finalPrice" class="premium-input" placeholder="800" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
            </div>
            <div>
              <label>📦 تكلفة المنتج (دج)</label>
              <input type="number" id="productCost" class="premium-input" placeholder="300" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
            </div>
            <div>
              <label>🚚 تكلفة التوصيل (دج)</label>
              <input type="number" id="deliveryCost" class="premium-input" placeholder="500" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
            </div>
          </div>

          <!-- Conversion Rates -->
          <div style="margin-bottom:24px;">
            <h4 style="font-weight:800;margin-bottom:16px;">📈 معدلات التحويل</h4>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
              <div>
                <label>✅ نسبة التأكيد (%)</label>
                <input type="number" id="confirmRate" class="premium-input" placeholder="30" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
              </div>
              <div>
                <label>📦 نسبة التسليم (%)</label>
                <input type="number" id="deliveryRate" class="premium-input" placeholder="70" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
              </div>
            </div>
          </div>

          <!-- Additional Costs -->
          <div style="margin-bottom:24px;">
            <h4 style="font-weight:800;margin-bottom:12px;">💸 التكاليف الإضافية الذكية</h4>
            <div class="alert-yellow" style="margin-bottom:16px;">
              <strong>⚠️ مهم:</strong> التكاليف الثابتة سيتم تقسيمها على عدد الطلبات المُسلّمة فعلياً (وليس على أيام الشهر).
            </div>
            <div id="additionalCosts"></div>
            <button onclick="addAdditionalCost()" class="btn" style="padding:10px 18px;border-radius:12px;font-weight:700;margin-top:12px;">➕ إضافة تكلفة</button>
          </div>

          <!-- Ad Spend -->
          <div style="margin-bottom:24px;">
            <h4 style="font-weight:800;margin-bottom:16px;">📢 الإنفاق الإعلاني اليومي</h4>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
              <div>
                <label>💵 ميزانية الإعلانات (دج)</label>
                <input type="number" id="adSpend" class="premium-input" placeholder="20000" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
              </div>
              <div>
                <label>📊 عدد الطلبات المتوقعة</label>
                <input type="number" id="expectedOrders" class="premium-input" placeholder="50" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculatePricing()" />
              </div>
            </div>
          </div>

          <!-- Results -->
          <div id="pricingResults"></div>
        </div>
      `;
    }

    // Render Predictions Tab
    function renderPredictionsTab(product) {
      return `
        <div class="glass-strong soft-border" style="padding:28px;border-radius:20px;">
          <h3 style="font-size:24px;font-weight:800;margin-bottom:24px;">📈 التوقعات الشهرية</h3>
          
          <div class="alert-info" style="margin-bottom:20px;">
            <strong>💡 معلومة:</strong> التوقعات تُحسب بناءً على متوسط الأداء في الأيام المسجلة.
          </div>

          <div id="monthlyPredictions"></div>
        </div>
      `;
    }

    // Render Discounts Tab
    function renderDiscountsTab(product) {
      return `
        <div class="glass-strong soft-border" style="padding:28px;border-radius:20px;">
          <h3 style="font-size:24px;font-weight:800;margin-bottom:24px;">🎁 حاسبة الخصومات</h3>
          
          <div style="margin-bottom:24px;">
            <label>💰 السعر الأصلي (دج)</label>
            <input type="number" id="discountOriginalPrice" class="premium-input" placeholder="1000" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculateDiscount()" />
          </div>

          <div style="margin-bottom:24px;">
            <label>🏷️ نسبة الخصم (%)</label>
            <input type="number" id="discountPercent" class="premium-input" placeholder="20" style="width:100%;padding:12px;border-radius:12px;margin-top:8px;" oninput="calculateDiscount()" />
          </div>

          <div id="discountResults"></div>
        </div>
      `;
    }

    // Render Charts Tab
    function renderChartsTab(product) {
      return `
        <div class="glass-strong soft-border" style="padding:28px;border-radius:20px;margin-bottom:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <h3 style="font-size:24px;font-weight:800;margin:0;">📊 الرسوم البيانية والتحليلات</h3>
            <button onclick="exportCharts()" class="export-btn" style="padding:8px 16px;font-size:13px;">📥 تصدير التقرير</button>
          </div>

          <!-- Date Range Filter -->
          <div style="margin-bottom:24px;">
            <label style="display:block;margin-bottom:10px;font-weight:700;">📅 فترة التحليل</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="date-quick-btn active" onclick="setChartRange('week')">آخر أسبوع</button>
              <button class="date-quick-btn" onclick="setChartRange('month')">آخر شهر</button>
              <button class="date-quick-btn" onclick="setChartRange('all')">كل الفترة</button>
            </div>
          </div>

          <div class="alert-info" style="margin-bottom:20px;">
            <strong>💡 ملاحظة:</strong> الرسوم البيانية تُحدّث تلقائياً بناءً على الأيام المسجلة في السجل الزمني.
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;">
            <div class="chart-frame">
              <div class="chart-inner">
                <h4 style="margin:0 0 12px 0;font-weight:700;">الأرباح اليومية</h4>
                <div class="chart-container">
                  <canvas id="profitChart"></canvas>
                </div>
              </div>
            </div>

            <div class="chart-frame">
              <div class="chart-inner">
                <h4 style="margin:0 0 12px 0;font-weight:700;">معدل ROI</h4>
                <div class="chart-container">
                  <canvas id="roiChart"></canvas>
                </div>
              </div>
            </div>

            <div class="chart-frame">
              <div class="chart-inner">
                <h4 style="margin:0 0 12px 0;font-weight:700;">معدلات التحويل</h4>
                <div class="chart-container">
                  <canvas id="conversionChart"></canvas>
                </div>
              </div>
            </div>

            <div class="chart-frame">
              <div class="chart-inner">
                <h4 style="margin:0 0 12px 0;font-weight:700;">تكلفة الطلب (CPO)</h4>
                <div class="chart-container">
                  <canvas id="cpoChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Render Campaigns Tab
    function renderCampaignsTab(product) {
      return `
        <div class="glass-strong soft-border" style="padding:28px;border-radius:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <h3 style="font-size:24px;font-weight:800;margin:0;">📢 متابعة الحملات الإعلانية</h3>
            <button onclick="showAddCampaignModal()" class="btn-gradient" style="padding:10px 20px;font-size:14px;">➕ إضافة حملة جديدة</button>
          </div>

          <div class="alert-info" style="margin-bottom:20px;">
            <strong>💡 نصيحة:</strong> الحملات مرتبطة بالأيام المسجلة. يمكنك اختيار فترة زمنية محددة لكل حملة.
          </div>

          <div id="campaignsList"></div>
        </div>
      `;
    }

    // Render Timeline Tab
    function renderTimelineTab(product) {
      return `
        <div class="glass-strong soft-border" style="padding:28px;border-radius:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <h3 style="font-size:24px;font-weight:800;margin:0;">📅 السجل الزمني للمنتج</h3>
            <button onclick="showComparisonMode()" class="export-btn" style="padding:8px 16px;font-size:13px;">🔄 مقارنة يومين</button>
          </div>

          <div class="alert-info" style="margin-bottom:20px;">

    // Calculate pricing
    function calculatePricing() {
      const finalPrice = parseFloat(document.getElementById('finalPrice')?.value) || 0;
      const productCost = parseFloat(document.getElementById('productCost')?.value) || 0;
      const deliveryCost = parseFloat(document.getElementById('deliveryCost')?.value) || 0;
      const confirmRate = parseFloat(document.getElementById('confirmRate')?.value) || 0;
      const deliveryRate = parseFloat(document.getElementById('deliveryRate')?.value) || 0;
      const adSpend = parseFloat(document.getElementById('adSpend')?.value) || 0;
      const expectedOrders = parseFloat(document.getElementById('expectedOrders')?.value) || 0;

      // Get additional costs
      const additionalCosts = getAdditionalCosts();
      
      // Calculate delivered orders
      const deliveredOrders = expectedOrders * (confirmRate / 100) * (deliveryRate / 100);
      
      // Calculate additional cost per order (divided by delivered orders, NOT by 30 days!)
      const additionalCostPerOrder = deliveredOrders > 0 ? 
        additionalCosts.reduce((sum, cost) => {
          if (cost.type === 'monthly') {
            return sum + (cost.value / deliveredOrders);
          } else {
            return sum + cost.value;
          }
        }, 0) : 0;

      // Calculate CPO (Cost Per Order)
      const cpo = expectedOrders > 0 ? adSpend / expectedOrders : 0;

      // Calculate total cost per delivered order
      const totalCostPerOrder = productCost + deliveryCost + cpo + additionalCostPerOrder;

      // Calculate profit
      const profitPerOrder = finalPrice - totalCostPerOrder;
      const totalProfit = profitPerOrder * deliveredOrders;

      // Calculate ROI
      const totalRevenue = finalPrice * deliveredOrders;
      const totalCost = totalCostPerOrder * deliveredOrders + adSpend;
      const roi = totalCost > 0 ? ((totalRevenue - totalCost) / totalCost) * 100 : 0;

      // Calculate ROAS
      const roas = adSpend > 0 ? totalRevenue / adSpend : 0;

      // Display results
      const resultsContainer = document.getElementById('pricingResults');
      if (resultsContainer) {
        resultsContainer.innerHTML = `
          <div style="background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.08));border:1px solid rgba(139,92,246,.25);border-radius:18px;padding:24px;margin-top:24px;">
            <h4 style="font-weight:800;margin-bottom:20px;font-size:20px;">📊 النتائج</h4>
            
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px;">
              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💰 الربح لكل طلب</div>
                <div style="font-size:28px;font-weight:900;color:${profitPerOrder >= 0 ? 'var(--good)' : 'var(--bad)'};">${formatNumber(profitPerOrder)} دج</div>
              </div>

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">📈 إجمالي الربح</div>
                <div style="font-size:28px;font-weight:900;color:${totalProfit >= 0 ? 'var(--good)' : 'var(--bad)'};">${formatNumber(totalProfit)} دج</div>
              </div>

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">📊 ROI</div>
                <div style="font-size:28px;font-weight:900;color:${roi >= 0 ? 'var(--good)' : 'var(--bad)'};">${formatNumber(roi)}%</div>
              </div>

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">🎯 ROAS</div>
                <div style="font-size:28px;font-weight:900;color:var(--brand2);">${formatNumber(roas)}x</div>
              </div>

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💸 تكلفة لكل طلب (CPO)</div>
                <div style="font-size:28px;font-weight:900;color:var(--brand3);">${formatNumber(cpo)} دج</div>
              </div>

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">📦 الطلبات المسلّمة</div>
                <div style="font-size:28px;font-weight:900;color:white;">${formatNumber(deliveredOrders)}</div>
              </div>
            </div>

            <div class="alert-yellow">
              <strong>💡 ملاحظة:</strong> التكاليف الإضافية الثابتة (${formatNumber(additionalCosts.filter(c => c.type === 'monthly').reduce((s, c) => s + c.value, 0))} دج شهرياً) تم تقسيمها على ${formatNumber(deliveredOrders)} طلب مُسلّم = ${formatNumber(additionalCostPerOrder)} دج لكل طلب.
            </div>
          </div>
        `;
      }
    }

    // Get additional costs
    function getAdditionalCosts() {
      const costs = [];
      const container = document.getElementById('additionalCosts');
      if (!container) return costs;

      const items = container.querySelectorAll('.cost-item');
      items.forEach(item => {
        const nameEl = item.querySelector('.cost-name');
        const valueEl = item.querySelector('.cost-value');
        const typeEl = item.querySelector('.cost-type');
        
        if (nameEl && valueEl && typeEl) {
          costs.push({
            name: nameEl.value,
            value: parseFloat(valueEl.value) || 0,
            type: typeEl.value
          });
        }
      });

      return costs;
    }

    function addAdditionalCost() {

    // Render calendar
    function renderCalendar(productId, selectedDate = null) {
      const container = document.getElementById('calendarContainer');
      if (!container) return;

      const product = products.find(p => p.id === productId);
      if (!product) return;

      const now = selectedDate ? new Date(selectedDate) : new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startDayOfWeek = firstDay.getDay();

      const monthNames = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
      const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

      let html = `
        <div class="calendar-container">
          <div class="calendar-header">
            <button class="calendar-nav-btn" onclick="changeMonth(-1)">◀</button>
            <div style="font-weight:800;font-size:18px;">${monthNames[month]} ${year}</div>
            <button class="calendar-nav-btn" onclick="changeMonth(1)">▶</button>
          </div>
          <div class="calendar-grid">
      `;

      // Day headers
      dayNames.forEach(day => {
        html += `<div class="calendar-day-header">${day}</div>`;
      });

      // Empty cells before first day
      for (let i = 0; i < startDayOfWeek; i++) {
        html += `<div class="calendar-day other-month"></div>`;
      }

      // Days
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasData = product.days && product.days.some(d => d.date === dateStr);
        const isSelected = currentDayDate === dateStr;
        const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();

        let classes = 'calendar-day';
        if (hasData) classes += ' has-data';
        if (isSelected) classes += ' selected';
        if (isToday) classes += ' today';

        html += `<div class="${classes}" onclick="selectDate('${dateStr}')">${day}</div>`;
      }

      html += `</div></div>`;
      container.innerHTML = html;
    }

    // Change month
    let currentCalendarDate = new Date();
    function changeMonth(delta) {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
      renderCalendar(currentProductId, currentCalendarDate);
    }

    // Select date
    function selectDate(dateStr) {
      currentDayDate = dateStr;
      renderCalendar(currentProductId, new Date(dateStr));
      loadDayData(currentProductId, dateStr);
    }

    // Load day data
    function loadDayData(productId, dateStr) {

                <option value="monthly" ${cost.type === 'monthly' ? 'selected' : ''}>شهري</option>

              </select>
              <button onclick="this.parentElement.remove();calculatePricing()" style="background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700;">✕</button>

        calculatePricing();

        document.getElementById('finalPrice').value = '';
        document.getElementById('productCost').value = '';
        document.getElementById('deliveryCost').value = '';

        document.getElementById('deliveryRate').value = '';

        document.getElementById('expectedOrders').value = '';

        if (container) container.innerHTML = '';

    // Save day data
    function saveDayData() {
      if (!currentProductId || !currentDayDate) {
        showAlert('⚠️ يرجى اختيار التاريخ أولاً', 'error');
        return;
      }

      const finalPrice = parseFloat(document.getElementById('finalPrice')?.value) || 0;
      const productCost = parseFloat(document.getElementById('productCost')?.value) || 0;
      const deliveryCost = parseFloat(document.getElementById('deliveryCost')?.value) || 0;
      const confirmRate = parseFloat(document.getElementById('confirmRate')?.value) || 0;
      const deliveryRate = parseFloat(document.getElementById('deliveryRate')?.value) || 0;
      const adSpend = parseFloat(document.getElementById('adSpend')?.value) || 0;
      const expectedOrders = parseFloat(document.getElementById('expectedOrders')?.value) || 0;

      if (!finalPrice || !productCost) {
        showAlert('⚠️ يرجى إدخال السعر النهائي وتكلفة المنتج على الأقل', 'error');
        return;
      }

      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      if (!product.days) product.days = [];

      const existingDayIndex = product.days.findIndex(d => d.date === currentDayDate);
      
      const dayData = {
        date: currentDayDate,
        finalPrice,
        productCost,
        deliveryCost,
        confirmRate,
        deliveryRate,
        adSpend,
        expectedOrders,
        additionalCosts: getAdditionalCosts(),
        savedAt: Date.now()
      };

      if (existingDayIndex >= 0) {
        product.days[existingDayIndex] = dayData;
        showAlert('✅ تم تحديث بيانات ' + currentDayDate, 'success');
      } else {
        product.days.push(dayData);
        showAlert('✅ تم حفظ بيانات ' + currentDayDate, 'success');
      }

      saveProducts();
      renderCalendar(currentProductId, new Date(currentDayDate));
      renderTimeline();
    }

    // Render timeline
    function renderTimeline() {
      const container = document.getElementById('timelineList');
      if (!container) return;

      const product = products.find(p => p.id === currentProductId);
      if (!product || !product.days || product.days.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding:40px;"><div class="empty-icon" style="font-size:48px;">📅</div><div class="empty-title" style="font-size:18px;">لا توجد أيام مسجلة بعد</div><div class="empty-description">ابدأ بإضافة بيانات يومك الأول في تبويب "حاسبة التسعير"</div></div>';

      const sortedDays = [...product.days].sort((a, b) => new Date(b.date) - new Date(a.date));

            </div>
          </div>

    // Calculate day profit
    function calculateDayProfit(dayData) {
      const deliveredOrders = dayData.expectedOrders * (dayData.confirmRate / 100) * (dayData.deliveryRate / 100);
      const additionalCostPerOrder = deliveredOrders > 0 ? 
        dayData.additionalCosts.reduce((sum, cost) => {
          if (cost.type === 'monthly') {
            return sum + (cost.value / deliveredOrders);
          } else {
            return sum + cost.value;
          }
        }, 0) : 0;
      
      const cpo = dayData.expectedOrders > 0 ? dayData.adSpend / dayData.expectedOrders : 0;
      const totalCostPerOrder = dayData.productCost + dayData.deliveryCost + cpo + additionalCostPerOrder;
      const profitPerOrder = dayData.finalPrice - totalCostPerOrder;
      
      return profitPerOrder * deliveredOrders;
    }

    // Calculate day ROI
    function calculateDayROI(dayData) {
      const deliveredOrders = dayData.expectedOrders * (dayData.confirmRate / 100) * (dayData.deliveryRate / 100);
      const additionalCostPerOrder = deliveredOrders > 0 ? 
        dayData.additionalCosts.reduce((sum, cost) => {
          if (cost.type === 'monthly') {
            return sum + (cost.value / deliveredOrders);
          } else {
            return sum + cost.value;
          }
        }, 0) : 0;
      
      const cpo = dayData.expectedOrders > 0 ? dayData.adSpend / dayData.expectedOrders : 0;
      const totalCostPerOrder = dayData.productCost + dayData.deliveryCost + cpo + additionalCostPerOrder;
      
      const totalRevenue = dayData.finalPrice * deliveredOrders;
      const totalCost = totalCostPerOrder * deliveredOrders + dayData.adSpend;
      
      return totalCost > 0 ? ((totalRevenue - totalCost) / totalCost) * 100 : 0;
    }

    // Select timeline day
    function selectTimelineDay(dateStr) {
      currentDayDate = dateStr;
      switchProductTab('pricing');
      renderCalendar(currentProductId, new Date(dateStr));
      loadDayData(currentProductId, dateStr);
    }

    // Edit timeline day
    function editTimelineDay(dateStr) {
      selectTimelineDay(dateStr);
    }

    // Delete timeline day
    function deleteTimelineDay(dateStr) {
      if (!confirm('هل أنت متأكد من حذف بيانات ' + dateStr + '؟')) return;

      const product = products.find(p => p.id === currentProductId);
      if (!product || !product.days) return;

      product.days = product.days.filter(d => d.date !== dateStr);
      saveProducts();
      
      showAlert('✅ تم حذف بيانات ' + dateStr, 'success');
      renderCalendar(currentProductId);
      renderTimeline();
    }

    // Calculate product total profit
    function calculateProductTotalProfit(product) {
      if (!product.days || product.days.length === 0) return 0;
      
      return product.days.reduce((total, day) => total + calculateDayProfit(day), 0);
    }

    // Calculate discount
    function calculateDiscount() {
      const original = parseFloat(document.getElementById('discountOriginalPrice')?.value) || 0;
      const percent = parseFloat(document.getElementById('discountPercent')?.value) || 0;

      const discountAmount = original * (percent / 100);
      const finalPrice = original - discountAmount;

      const resultsContainer = document.getElementById('discountResults');
      if (resultsContainer) {
        resultsContainer.innerHTML = `
          <div style="background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.08));border:1px solid rgba(139,92,246,.25);border-radius:18px;padding:24px;margin-top:24px;">

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💸 قيمة الخصم</div>
                <div style="font-size:28px;font-weight:900;color:var(--brand2);">${formatNumber(discountAmount)} دج</div>
              </div>

              <div class="stat-card">
                <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;">💰 السعر النهائي</div>
                <div style="font-size:28px;font-weight:900;color:var(--good);">${formatNumber(finalPrice)} دج</div>
              </div>
            </div>
          </div>
        `;
      }
    }

    // Render all charts
    function renderAllCharts() {
      const product = products.find(p => p.id === currentProductId);
      if (!product || !product.days || product.days.length === 0) {
        ['profitChart', 'roiChart', 'conversionChart', 'cpoChart'].forEach(id => {
          const canvas = document.getElementById(id);
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px Tajawal';
            ctx.fillStyle = 'rgba(255,255,255,.5)';
            ctx.textAlign = 'center';
            ctx.fillText('لا توجد بيانات كافية', canvas.width / 2, canvas.height / 2);
          }
        });
        return;
      }

      const sortedDays = [...product.days].sort((a, b) => new Date(a.date) - new Date(b.date));
      const labels = sortedDays.map(d => d.date);
      
      // Profit chart
      const profitData = sortedDays.map(d => calculateDayProfit(d));
      renderChart('profitChart', 'line', labels, profitData, 'الأرباح (دج)', 'rgba(139,92,246,.8)');

      // ROI chart
      const roiData = sortedDays.map(d => calculateDayROI(d));
      renderChart('roiChart', 'line', labels, roiData, 'ROI (%)', 'rgba(34,211,238,.8)');

      // Conversion chart
      const confirmData = sortedDays.map(d => d.confirmRate);
      const deliveryData = sortedDays.map(d => d.deliveryRate);
      renderMultiChart('conversionChart', labels, [
        { label: 'نسبة التأكيد', data: confirmData, color: 'rgba(139,92,246,.8)' },
        { label: 'نسبة التسليم', data: deliveryData, color: 'rgba(34,211,238,.8)' }
      ]);

      // CPO chart
      const cpoData = sortedDays.map(d => d.expectedOrders > 0 ? d.adSpend / d.expectedOrders : 0);
      renderChart('cpoChart', 'bar', labels, cpoData, 'تكلفة لكل طلب (دج)', 'rgba(96,165,250,.8)');
    }

    // Render single chart
    function renderChart(canvasId, type, labels, data, label, color) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      if (canvas.chart) {
        canvas.chart.destroy();
      }

      const ctx = canvas.getContext('2d');
      canvas.chart = new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: data,
            borderColor: color,
            backgroundColor: color.replace('0.8', '0.2'),
            borderWidth: 2,
            tension: 0.4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: 'rgba(255,255,255,.1)'
              },
              ticks: {
                color: 'rgba(255,255,255,.7)'
              }
            },
            x: {
              grid: {
                color: 'rgba(255,255,255,.1)'
              },
              ticks: {
                color: 'rgba(255,255,255,.7)'
              }
            }
          }
        }
      });
    }

    // Render multi-line chart
    function renderMultiChart(canvasId, labels, datasets) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      if (canvas.chart) {
        canvas.chart.destroy();
      }

      const ctx = canvas.getContext('2d');
      canvas.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets.map(ds => ({
            label: ds.label,
            data: ds.data,
            borderColor: ds.color,
            backgroundColor: ds.color.replace('0.8', '0.2'),
            borderWidth: 2,
            tension: 0.4,
            fill: false
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                color: 'rgba(255,255,255,.9)',
                font: {
                  family: 'Tajawal'
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: 'rgba(255,255,255,.1)'
              },
              ticks: {
                color: 'rgba(255,255,255,.7)'
              }
            },
            x: {
              grid: {
                color: 'rgba(255,255,255,.1)'
              },
              ticks: {
                color: 'rgba(255,255,255,.7)'
              }
            }
          }
        }
      });
    }

    // Format number
    function formatNumber(num) {
      if (isNaN(num)) return '0';
      return new Intl.NumberFormat('ar-DZ').format(Math.round(num * 100) / 100);
    }

      alert.innerHTML = `

    // Save campaign
    function saveCampaign(editId = null) {
      const name = document.getElementById('campaignName').value.trim();
      const startDate = document.getElementById('campaignStartDate').value;
      const endDate = document.getElementById('campaignEndDate').value;
      const platform = document.getElementById('campaignPlatform').value;

      if (!name) {
        showAlert('⚠️ يرجى إدخال اسم الحملة', 'error');
        return;
      }

      if (new Date(startDate) > new Date(endDate)) {
        showAlert('⚠️ تاريخ البداية يجب أن يكون قبل تاريخ النهاية', 'error');
        return;
      }

      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      if (!product.campaigns) product.campaigns = [];

      const campaign = {
        id: editId || 'camp_' + Date.now(),
        name,
        startDate,
        endDate,
        platform,
        createdAt: editId ? product.campaigns.find(c => c.id === editId).createdAt : Date.now(),
        updatedAt: Date.now()
      };

      if (editId) {
        const index = product.campaigns.findIndex(c => c.id === editId);
        product.campaigns[index] = campaign;
        showAlert('✅ تم تحديث الحملة بنجاح!', 'success');
      } else {
        product.campaigns.push(campaign);
        showAlert('✅ تم إنشاء الحملة بنجاح!', 'success');
      }

      saveProducts();
      document.getElementById('campaignModal')?.remove();
      renderCampaignsList();
    }
