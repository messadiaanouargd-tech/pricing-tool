<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070812" />
  <title>PRO • COD Pricing Tool</title>

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    /* أنماط CSS الأساسية */
    :root{ --bg0:#070812; --bg1:#060713; --text:rgba(255,255,255,.92); --brand1:#8b5cf6; --brand2:#22d3ee; }
    body{ margin:0; color:var(--text); background:linear-gradient(180deg,var(--bg0),var(--bg1)); font-family:Tajawal,Inter,sans-serif; overflow-x:hidden; }
    .glass{ background:rgba(255,255,255,.05); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.1); box-shadow:0 8px 32px rgba(0,0,0,.3); }
    .premium-input{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:white; outline:none; transition:.2s; }
    .premium-input:focus{ border-color:var(--brand1); box-shadow:0 0 0 2px rgba(139,92,246,.2); }
    .btn-gradient{ background:linear-gradient(135deg,var(--brand1),var(--brand2)); color:white; font-weight:bold; transition:.2s; }
    .btn-gradient:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(139,92,246,.3); }
    
    /* أنماط الشات بوت */
    #chat-widget { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    #chat-toggle-btn { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3); display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.2s; }
    #chat-toggle-btn:hover { transform: scale(1.05); }
    #chatWindow { display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 500px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; font-family: 'Tajawal', sans-serif; border: 1px solid rgba(0,0,0,0.1); }
    .chat-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
    .chat-footer { padding: 12px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; background: white; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
    .user-msg { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot-msg { background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    /* Responsive */
    @media (max-width: 640px) { #chatWindow { width: 90vw; right: -10px; bottom: 70px; } }
  </style>

  <!-- كود الحماية (Firebase Auth) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoDXsELYXl440Wb3bd6xir0sMbj-6LSIA",
      authDomain: "cod-pricing.firebaseapp.com",
      projectId: "cod-pricing",
      storageBucket: "cod-pricing.firebasestorage.app",
      messagingSenderId: "815665273956",
      appId: "1:815665273956:web:6a496b1d28da2aa0b25371",
      measurementId: "G-7XLMBDYNXG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "login.html";
    });

    window.logout = () => signOut(auth);
  </script>
</head>
<body>

  <!-- المحتوى الرئيسي للأداة (مختصر للعرض) -->
  <div class="min-h-screen p-4 flex flex-col items-center">
    <!-- Header -->
    <div class="w-full max-w-4xl glass rounded-2xl p-4 mb-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">COD Pricing Tool</h1>
        <span class="px-2 py-1 bg-purple-500/20 text-purple-300 text-xs rounded-full">v4.1 PRO</span>
      </div>
      <button onclick="window.logout()" class="text-sm text-red-400 hover:text-red-300">تسجيل خروج</button>
    </div>

    <!-- الآلة الحاسبة -->
    <div class="w-full max-w-4xl glass rounded-3xl p-8 mb-20">
      <h2 class="text-2xl font-bold text-center mb-6">حاسبة الأرباح الذكية 🇩🇿</h2>
      
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm text-gray-400 mb-2">سعر البيع (DZD)</label>
          <input type="number" id="selling_price" class="w-full p-3 rounded-xl premium-input" placeholder="5900" oninput="calculate()">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2">سعر الشراء (DZD)</label>
          <input type="number" id="product_cost" class="w-full p-3 rounded-xl premium-input" placeholder="2500" oninput="calculate()">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2">تكلفة الإعلان (CPO)</label>
          <input type="number" id="ad_cost" class="w-full p-3 rounded-xl premium-input" placeholder="600" oninput="calculate()">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2">تكلفة التوصيل</label>
          <input type="number" id="delivery_cost" class="w-full p-3 rounded-xl premium-input" placeholder="800" oninput="calculate()">
        </div>
      </div>

      <div class="mt-8 p-6 bg-slate-900/50 rounded-2xl border border-white/5">
        <div class="flex justify-between items-center mb-2">
          <span class="text-gray-400">الربح الصافي:</span>
          <span id="net_profit" class="text-2xl font-bold text-emerald-400">0 DZD</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-400">نسبة العائد (ROI):</span>
          <span id="roi_res" class="text-lg font-bold text-blue-400">0%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- الشات بوت (الويدجت) -->
  <div id="chat-widget">
    <div id="chatWindow">
        <div class="chat-header">
            <span>المستشار الذكي 🤖</span>
            <span onclick="toggleChat()" style="cursor: pointer; opacity: 0.8;">✕</span>
        </div>
        <div id="chatBody" class="chat-body">
            <div class="msg bot-msg">مرحبا! أنا هنا باش نعاونك في حساباتك واستراتيجية البيع. واش تحب تسقسي؟</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="اكتب سؤالك..." class="flex-1 p-2 border rounded-lg outline-none text-gray-700 text-sm" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" class="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition">➤</button>
        </div>
    </div>
    <button id="chat-toggle-btn" onclick="toggleChat()">💬</button>
  </div>

  <script>
    // 1. منطق الآلة الحاسبة
    function calculate() {
        const price = parseFloat(document.getElementById('selling_price').value) || 0;
        const cost = parseFloat(document.getElementById('product_cost').value) || 0;
        const ad = parseFloat(document.getElementById('ad_cost').value) || 0;
        const delivery = parseFloat(document.getElementById('delivery_cost').value) || 0;

        const profit = price - cost - ad - delivery;
        const roi = (cost + ad + delivery) > 0 ? (profit / (cost + ad + delivery)) * 100 : 0;

        document.getElementById('net_profit').innerText = profit.toFixed(0) + " DZD";
        document.getElementById('net_profit').style.color = profit >= 0 ? "#34d399" : "#f87171";
        document.getElementById('roi_res').innerText = roi.toFixed(1) + "%";
    }

    // 2. منطق الشات بوت (Streaming Chat)
    function toggleChat() {
        const win = document.getElementById('chatWindow');
        const isHidden = win.style.display === 'none' || win.style.display === '';
        win.style.display = isHidden ? 'flex' : 'none';
        if (isHidden) setTimeout(() => document.getElementById('chatInput').focus(), 100);
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const body = document.getElementById('chatBody');
        const txt = input.value.trim();
        
        if (!txt) return;

        // إضافة رسالة المستخدم
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user-msg';
        userDiv.textContent = txt;
        body.appendChild(userDiv);
        
        input.value = '';
        body.scrollTop = body.scrollHeight;

        // إضافة فقاعة "جاري الكتابة..."
        const botDiv = document.createElement('div');
        botDiv.className = 'msg bot-msg';
        botDiv.textContent = "✍️...";
        body.appendChild(botDiv);
        body.scrollTop = body.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: txt })
            });

            if (!response.ok) throw new Error("فشل الاتصال");

            // مسح المؤشر والبدء في الكتابة
            botDiv.textContent = "";
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                // قراءة البيانات كنص متدفق
                const chunk = decoder.decode(value, { stream: true });
                botDiv.textContent += chunk;
                body.scrollTop = body.scrollHeight;
            }

        } catch (error) {
            botDiv.textContent = "حدث خطأ في الاتصال، حاول مرة أخرى.";
            botDiv.style.color = "#dc2626";
        }
    }
  </script>

</body>
</html>
