<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070812" />
  <title>PRO • COD Pricing Tool</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js + PDF libs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg0:#070812;
      --bg1:#060713;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.66);
      --stroke:rgba(255,255,255,.12);
      --glass:rgba(255,255,255,.06);
      --glass2:rgba(255,255,255,.10);
      --brand1:#8b5cf6;
      --brand2:#22d3ee;
      --brand3:#60a5fa;
      --good:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
      --shadow:0 24px 70px rgba(0,0,0,.45);
    }
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 70% 10%, rgba(139,92,246,.18), transparent 60%),
        radial-gradient(1000px 600px at 10% 35%, rgba(34,211,238,.14), transparent 55%),
        radial-gradient(900px 700px at 50% 100%, rgba(96,165,250,.12), transparent 60%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
      font-family:Tajawal,Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;
    }
    .glass{
      background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      backdrop-filter: blur(16px);
    }
    .glass-strong{
      background:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 26px 90px rgba(0,0,0,.52);
      backdrop-filter: blur(18px);
    }
    .soft-border{position:relative}
    .soft-border:before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:18px;
      padding:1px;
      background:linear-gradient(135deg, rgba(139,92,246,.55), rgba(34,211,238,.35), rgba(96,165,250,.45));
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      opacity:.55;
      pointer-events:none;
    }
    .gradient-text{
      background:linear-gradient(135deg,var(--brand1),var(--brand2),var(--brand3));
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .premium-input{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      color:var(--text);
      outline:none;
      transition:.18s ease;
    }
    .premium-input:focus{
      border-color:rgba(139,92,246,.65);
      box-shadow:0 0 0 4px rgba(139,92,246,.18);
      background:rgba(255,255,255,.08);
    }
    .btn{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      transition:.2s ease;
    }
    .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
    .btn.active{
      background:linear-gradient(135deg, rgba(139,92,246,.95), rgba(34,211,238,.45));
      border-color:rgba(139,92,246,.65);
      box-shadow:0 14px 45px rgba(139,92,246,.22);
    }
    .btn-gradient{
      border:1px solid rgba(255,255,255,.18);
      background:linear-gradient(135deg, rgba(139,92,246,.92), rgba(34,211,238,.45));
      border-radius:16px;
      font-weight:900;
      transition:.25s ease;
    }
    .btn-gradient:hover{
      transform:translateY(-2px);
      box-shadow:0 30px 90px rgba(34,211,238,.18), 0 26px 80px rgba(139,92,246,.16);
    }
    .tab-button{
      border:1px solid transparent;
      color:rgba(255,255,255,.62);
      padding:10px 16px;
      border-radius:14px;
      transition:.2s ease;
      white-space:nowrap;
    }
    .tab-button:hover{
      color:rgba(255,255,255,.92);
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.10);
    }
    .tab-button.active{
      color:rgba(255,255,255,.95);
      background:rgba(255,255,255,.10);
      border-color:rgba(139,92,246,.45);
      box-shadow:0 14px 45px rgba(139,92,246,.18);
    }
    .tab-content{display:none}
    .tab-content.active{display:block}
    .stat-card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:22px;
      transition:.25s ease;
      backdrop-filter: blur(12px);
    }
    .stat-card:hover{
      transform:translateY(-3px);
      border-color:rgba(139,92,246,.35);
      background:rgba(255,255,255,.08);
      box-shadow:0 22px 70px rgba(0,0,0,.35);
    }
    .chart-frame{
      border-radius:18px;
      overflow:hidden;
      background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 26px 90px rgba(0,0,0,.50);
    }
    .chart-inner{padding:14px}
    .chart-container{position:relative;height:320px}
    .no-print{}
    @media print{
      .no-print{display:none !important;}
      body{background:#fff !important;color:#000 !important;}
    }
    /* Scenario buttons */
    .scenario-btn{
      background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      transition: .25s ease;
      box-shadow:
        0 18px 60px rgba(0,0,0,.25),
        0 0 0 1px rgba(255,255,255,.06),
        0 0 22px rgba(139,92,246,.14),
        0 0 18px rgba(34,211,238,.10);
    }
    .scenario-btn:hover{
      transform: translateY(-2px);
      border-color: rgba(139,92,246,.45);
      box-shadow:
        0 26px 90px rgba(0,0,0,.32),
        0 0 0 1px rgba(255,255,255,.08),
        0 0 34px rgba(139,92,246,.22),
        0 0 26px rgba(34,211,238,.16);
    }
    .scenario-btn:active{
      transform: translateY(0px);
    }

    /* تكبير الخطوط في كل الأداة */
    body {
      font-size: 16px;
    }
    .premium-input, input, select {
      font-size: 16px !important;
    }
    label {
      font-size: 15px !important;
    }
    .stat-card {
      font-size: 16px;
    }
    h1, h2, h3, h4 {
      font-size: 1.1em !important;
    }
  </style>

  <!-- ===================== CHAT BOT WIDGET (NEW STREAMING) ===================== -->
  <div id="chat-widget" class="no-print" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
    <div id="chatWindow" style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 500px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; font-family: 'Tajawal', sans-serif; border: 1px solid rgba(0,0,0,0.1);">
        <div class="chat-header" style="background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 20px;">🤖</span>
                <span>المستشار الذكي</span>
            </div>
            <span onclick="toggleChat()" style="cursor: pointer; opacity: 0.8; padding: 5px;">✕</span>
        </div>
        <div id="chatBody" class="chat-body" style="flex: 1; padding: 15px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px;">
            <div class="msg bot-msg" style="padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; word-wrap: break-word; background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px;">مرحبا! أنا هنا باش نعاونك في حساباتك واستراتيجية البيع. واش تحب تسقسي؟</div>
        </div>
        <div class="chat-footer" style="padding: 12px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; background: white;">
            <input type="text" id="chatInput" placeholder="اكتب سؤالك..." style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px; outline: none; color: #333;" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" style="background: #2563eb; color: white; padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s;">➤</button>
        </div>
    </div>
    <button id="chat-toggle-btn" onclick="toggleChat()" style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3); display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.2s;">💬</button>
  </div>

  <script>
    // دالة فتح وإغلاق الشات
    function toggleChat() {
        const win = document.getElementById('chatWindow');
        const isHidden = win.style.display === 'none' || win.style.display === '';
        win.style.display = isHidden ? 'flex' : 'none';
        if (isHidden) setTimeout(() => document.getElementById('chatInput').focus(), 100);
    }

    // دالة التعامل مع زر Enter
    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // دالة الإرسال (التي تدعم النص المتدفق Streaming)
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const body = document.getElementById('chatBody');
        const txt = input.value.trim();

        if (!txt) return;

        // 1. إضافة رسالة المستخدم
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user-msg';
        userDiv.style.cssText = "padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; word-wrap: break-word; background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px;";
        userDiv.textContent = txt;
        body.appendChild(userDiv);

        input.value = '';
        body.scrollTop = body.scrollHeight;

        // 2. إضافة مؤشر الكتابة للبوت
        const botDiv = document.createElement('div');
        botDiv.className = 'msg bot-msg';
        botDiv.style.cssText = "padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; word-wrap: break-word; background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px;";
        botDiv.textContent = "✍️...";
        body.appendChild(botDiv);
        body.scrollTop = body.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: txt })
            });

            if (!response.ok) {
                throw new Error("فشل الاتصال بالسيرفر");
            }

            // 3. مسح المؤشر والبدء في استقبال الرد المتدفق
            botDiv.textContent = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // قراءة البيانات كنص خام (Plain Text)
                const chunk = decoder.decode(value, { stream: true });
                botDiv.textContent += chunk;
                body.scrollTop = body.scrollHeight;
            }

        } catch (error) {
            console.error("Chat Error:", error);
            botDiv.innerHTML = `<span style="color:#ef4444">حدث خطأ في الاتصال، حاول مرة أخرى.</span>`;
        }
    }
  </script>
</body>
